name: Avtomatik Xəbər Botu

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyanı yüklə
        uses: actions/checkout@v4

      - name: Python 3.12 quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Kitabxanaları yüklə
        run: pip install -r requirements.txt

      - name: Xəbər botunu işə sal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FEEDS_PATH: feeds.json
          HISTORY_PATH: history.json
        run: |
          mkdir -p src
          cp __init__.py ai_processor.py main.py memory.py rss_reader.py telegram_poster.py src/
          python -m src.main

      - name: Yaddaş faylını saxla
        run: |
          git config user.name "news-bot[bot]"
          git config user.email "news-bot[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "chore: update news memory [skip ci]"
          git push
