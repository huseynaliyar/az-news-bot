name: Günün Maliyyə Bülleteni

on:
  schedule:
    # 06:30 UTC = 10:30 Bakı vaxtı (hər gün)
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  send-market-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyanı yüklə
        uses: actions/checkout@v4

      - name: Python 3.12 quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Kitabxanaları yüklə
        run: pip install -r requirements.txt

      - name: Maliyyə bülletenini göndər
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python market_digest.py
